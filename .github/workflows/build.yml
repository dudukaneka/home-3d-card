name: Build & Validate HACS Card

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & unit tests
        run: npm run typecheck && npm test

      - name: Build HACS bundle
        run: npm run build

      - name: Validate GLB and area config
        run: npm run validate:model

      - name: Upload built bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: home-3d-card
          path: dist/home-3d-card.js

      - name: Attach bundle to GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/home-3d-card.js
