<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home 3D Card — Standalone Preview</title>
    <style>
      body {
        margin: 0;
        padding: 20px;
        background: #020617;
        color: #f8fafc;
        font-family: system-ui, -apple-system, sans-serif;
      }
      .wrap {
        max-width: 1200px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        padding: 12px 16px;
        border-radius: 12px;
        background: #0f172a;
        border: 1px solid rgba(148, 163, 184, 0.2);
      }
      .controls label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 0.88rem;
      }
      select,
      button {
        padding: 6px 10px;
        border-radius: 8px;
        background: #1e293b;
        color: #f8fafc;
        border: 1px solid rgba(148, 163, 184, 0.3);
        cursor: pointer;
      }
      button:hover {
        background: #334155;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="controls">
        <strong>Home 3D Card — Preview</strong>
        <label>
          Detail Mode:
          <select id="modeSelect">
            <option value="slide-over" selected>Slide-over (Default)</option>
            <option value="fullscreen">Fullscreen</option>
          </select>
        </label>
        <label>
          <input type="checkbox" id="debugCheck" />
          Debug coordinate picker
        </label>
        <button id="loadExampleBtn" type="button">Load Sample Home</button>
        <button id="clearModelBtn" type="button">Test Empty Onboarding</button>
      </div>
      <div id="mount"></div>
    </div>
    <script type="module" src="/src/dev-preview.ts"></script>
  </body>
</html>
